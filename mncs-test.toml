schema_version = "mncs.test-manifest/1"
name = "mncs-test-self"
source = "tests/self_suite.mncs"
module = "tests.self_suite"
suite = "suite"
profile = "0.16"
step_budget = 200000
timeout_seconds = 60
libraries = ["native"]

[[tests]]
id = "arithmetic"
entry = "test_arithmetic"
kind = "unit"
tags = ["self", "assertion"]

[[tests]]
id = "boolean"
entry = "test_boolean"
kind = "unit"
tags = ["self", "assertion"]

[[tests]]
id = "task-lifecycle"
entry = "test_task_lifecycle"
kind = "integration"
tags = ["self", "stdlib"]

[[tests]]
id = "deterministic-replay"
entry = "test_property_replay"
