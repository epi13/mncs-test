tags = ["self", "property", "deterministic"]
seed = 42
case_index = 7

[[tests]]
id = "snapshot-witness"
entry = "test_snapshot_witness"
kind = "snapshot"
tags = ["self", "snapshot"]

[[tests]]
id = "documented-skip"
entry = "test_skipped"
kind = "skip"
tags = ["self", "skip"]
